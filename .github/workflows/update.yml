name: Update player values

on:
  schedule:
    # Daily at 11:17 UTC (6-7am US Eastern), after the night's games are final.
    - cron: "17 11 * * *"
  workflow_dispatch:
  # Every push to any branch rebuilds and tests; only main deploys (below).
  push:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests
      - run: node --test tests/*.test.js
      - name: Build values
        env:
          # Optional: set repository secret HTTPS_PROXY (e.g. http://user:pass@host:port)
          # if basketball-reference starts blocking GitHub's runners.
          HTTPS_PROXY: ${{ secrets.HTTPS_PROXY }}
        run: python -m fbc.build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
